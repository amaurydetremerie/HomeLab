apiVersion: v1
kind: Secret
metadata:
  name: litellm-secret
  namespace: litellm
type: Opaque
stringData:
  LITELLM_MASTER_KEY: <path:k3s/data/litellm#master_key>
  #Tools
  BRAVE_API_KEY: <path:k3s/data/litellm#brave_search_api_key>
  CONTEXT7_API_KEY: <path:k3s/data/litellm#context7_api_key>
  #Providers
  GEMINI_API_KEY: <path:k3s/data/litellm#gemini_api_key>
  GROQ_API_KEY: <path:k3s/data/litellm#groq_api_key>
  MISTRAL_API_KEY: <path:k3s/data/litellm#mistral_api_key>
  OPENROUTER_API_KEY: <path:k3s/data/litellm#openrouter_api_key>
  NVIDIA_NIM_API_KEY: <path:k3s/data/litellm#nvidia_nim_api_key>
  AGENTROUTER_API_KEY: <path:k3s/data/litellm#agentrouter_api_key>
  ORCAROUTER_API_KEY: <path:k3s/data/litellm#orcarouter_api_key>
  ORCAROUTER_API_BASE: "https://api.orcarouter.ai/v1"
  OPENCODE_API_KEY: <path:k3s/data/litellm#opencode_api_key>
  OPENCODE_API_BASE_OPENAI: "https://opencode.ai/zen/go/v1"
  OPENCODE_API_BASE_ANTHROPIC: "https://opencode.ai/zen/go"
  OPENCODE_SESSION: "homelab-litellm"
  #OAuth
  GITHUB_COPILOT_TOKEN_DIR: "/mnt/config/tokens"
  CHATGPT_TOKEN_DIR: "/mnt/config/tokens"
