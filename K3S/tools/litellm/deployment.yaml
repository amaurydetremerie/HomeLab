apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: litellm
  name: litellm
  namespace: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.101.0
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/app/config.yaml"
            - "--port"
            - "4000"
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: litellm-secret
          volumeMounts:
            - name: litellm-config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - mountPath: /mnt/config/tokens
              name: litellm-volume
              subPath: litellm
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: litellm-config
          configMap:
            name: litellm-config
        - name: litellm-volume
          persistentVolumeClaim:
            claimName: litellm-pvc
