apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    model_list:
      # ═══════════════════════════════════════════════════════════════════════
      # FREE MODELS GROUP
      # ═══════════════════════════════════════════════════════════════════════
    
      # ── free-xhigh ──────────────────────────────────────────────────────────
      - model_name: free-xhigh
        litellm_params:
          model: openrouter/deepseek/deepseek-r1:free
          api_key: os.environ/OPENROUTER_API_KEY
      - model_name: free-xhigh
        litellm_params:
          model: openrouter/google/gemini-2.5-pro-exp-03-25:free
          api_key: os.environ/OPENROUTER_API_KEY
      - model_name: free-xhigh
        litellm_params:
          model: nvidia_nim/meta/llama-3.1-405b-instruct
          api_key: os.environ/NVIDIA_NIM_API_KEY

      # ── free-high ────────────────────────────────────────────────────────────
      - model_name: free-high
        litellm_params:
          model: openrouter/deepseek/deepseek-chat-v3-0324:free
          api_key: os.environ/OPENROUTER_API_KEY
      - model_name: free-high
        litellm_params:
          model: openrouter/nvidia/llama-3.1-nemotron-70b-instruct:free
          api_key: os.environ/OPENROUTER_API_KEY
      - model_name: free-high
        litellm_params:
          model: gemini/gemini-2.0-flash
          api_key: os.environ/GEMINI_API_KEY
      - model_name: free-high
        litellm_params:
          model: nvidia_nim/nvidia/llama-3.1-nemotron-70b-instruct
          api_key: os.environ/NVIDIA_NIM_API_KEY

      # ── free-medium ──────────────────────────────────────────────────────────
      - model_name: free-medium
        litellm_params:
          model: openrouter/meta-llama/llama-3.3-70b-instruct:free
          api_key: os.environ/OPENROUTER_API_KEY
      - model_name: free-medium
        litellm_params:
          model: openrouter/qwen/qwen-2.5-72b-instruct:free
          api_key: os.environ/OPENROUTER_API_KEY
      - model_name: free-medium
        litellm_params:
          model: openrouter/google/gemma-3-27b-it:free
          api_key: os.environ/OPENROUTER_API_KEY
      - model_name: free-medium
        litellm_params:
          model: gemini/gemini-1.5-flash
          api_key: os.environ/GEMINI_API_KEY

      # ── free-low ─────────────────────────────────────────────────────────────
      - model_name: free-low
        litellm_params:
          model: openrouter/meta-llama/llama-3.1-8b-instruct:free
          api_key: os.environ/OPENROUTER_API_KEY
      - model_name: free-low
        litellm_params:
          model: openrouter/mistralai/mistral-7b-instruct:free
          api_key: os.environ/OPENROUTER_API_KEY
      - model_name: free-low
        litellm_params:
          model: nvidia_nim/meta/llama-3.1-8b-instruct
          api_key: os.environ/NVIDIA_NIM_API_KEY

      # ── free-xlow ────────────────────────────────────────────────────────────
      - model_name: free-xlow
        litellm_params:
          model: openrouter/microsoft/phi-3.5-mini-128k-instruct:free
          api_key: os.environ/OPENROUTER_API_KEY
      - model_name: free-xlow
        litellm_params:
          model: openrouter/google/gemma-3-1b-it:free
          api_key: os.environ/OPENROUTER_API_KEY
      - model_name: free-xlow
        litellm_params:
          model: gemini/gemini-1.5-flash-8b
          api_key: os.environ/GEMINI_API_KEY


      # ═══════════════════════════════════════════════════════════════════════
      # PAID MODELS GROUP
      # ═══════════════════════════════════════════════════════════════════════

      # ── openai ───────────────────────────────────────────────────────────────
      - model_name: openai
        litellm_params:
          model: openai/gpt-4o
          api_key: os.environ/OPENAI_API_KEY

      # ── copilot ──────────────────────────────────────────────────────────────
      # Désactivé : LiteLLM tente le device flow OAuth au démarrage si pas de token
      # Pour activer : générer api-key.json localement (litellm --model github_copilot/gpt-4o),
      # stocker dans Vault, et monter comme secret dans /root/.config/litellm/github_copilot/
      # - model_name: copilot
      #   litellm_params:
      #     model: github_copilot/gpt-4o
      #     api_key: os.environ/GITHUB_COPILOT_API_KEY

      # ── 1minai ───────────────────────────────────────────────────────────────
      # Nécessite l'adaptateur 1min.AI (1minai-adapter-svc) — à décommenter quand prêt
      # - model_name: 1minai
      #   litellm_params:
      #     model: openai/default
      #     api_base: http://1minai-adapter-svc.litellm.svc.cluster.local:8000
      #     api_key: os.environ/ONE_MIN_AI_API_KEY

      # ── ollama-local ─────────────────────────────────────────────────────────
      # CPU-only backup — décommenter quand le LXC Ollama (10.100.0.204) est prêt
      # - model_name: ollama-local
      #   litellm_params:
      #     model: ollama/llama3.2
      #     api_base: http://10.100.0.204:11434


      # ═══════════════════════════════════════════════════════════════════════
      # WILDCARD PASS-THROUGH 
      # ═══════════════════════════════════════════════════════════════════════

      - model_name: openrouter/*
        litellm_params:
          model: openrouter/*:free
          api_key: os.environ/OPENROUTER_API_KEY

      - model_name: gemini/*
        litellm_params:
          model: gemini/*
          api_key: os.environ/GEMINI_API_KEY

      - model_name: nvidia_nim/*
        litellm_params:
          model: nvidia_nim/*
          api_key: os.environ/NVIDIA_NIM_API_KEY

      - model_name: openai/*
        litellm_params:
          model: openai/*
          api_key: os.environ/OPENAI_API_KEY

      # - model_name: github_copilot/*
      #   litellm_params:
      #     model: github_copilot/*
      #     api_key: os.environ/GITHUB_COPILOT_API_KEY
          
      - model_name: ollama/*
        litellm_params:
          model: ollama/*
          api_key: os.environ/OLLAMA_API_KEY
        
      #- model_name: 1minai/*
      #  litellm_params:
      #    model: 1minai/*
      #    api_key: os.environ/ONE_MIN_AI_API_KEY
          
      #- model_name: ollama/*
      #  litellm_params:
      #    model: ollama/*


    # ═══════════════════════════════════════════════════════════════════════════
    # ROUTER — fallback chains + error behavior
    # ═══════════════════════════════════════════════════════════════════════════
    router_settings:
      routing_strategy: latency-based-routing

      fallbacks:
        # hermes : free first (xhigh→high→medium), then paid one and finish with low free tier
        - hermes: ["free-xhigh", "free-high", "free-medium", "openai", "1minai", "free-low", "free-xlow", "ollama-local"]
        # free : free only
        - free: ["free-xhigh", "free-high", "free-medium", "free-low", "free-xlow", "ollama-local"]
        # premium : paid first then free one
        - premium: ["openai", "1minai", "free-xhigh", "free-high", "free-medium", "free-low", "free-xlow", "ollama-local"]

      num_retries: 2
      allowed_fails: 2
      cooldown_time: 60
      timeout: 60


    # ═══════════════════════════════════════════════════════════════════════════
    # GENERAL
    # ═══════════════════════════════════════════════════════════════════════════
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
