apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: omniroute
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  source:
    repoURL: https://git.wiserisk.be/wiserisk/HomeLab.git
    targetRevision: HEAD
    path: K3S/tools/omniroute
  destination:
    server: https://kubernetes.default.svc
    namespace: omniroute
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true